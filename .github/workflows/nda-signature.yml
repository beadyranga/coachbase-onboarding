name: NDA signature

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  check:
    # Runs on issues from the signing form (by label, or by title if the label doesn't exist yet).
    if: contains(github.event.issue.labels.*.name, 'nda-request') || startsWith(github.event.issue.title, 'NDA signature')
    runs-on: ubuntu-latest
    steps:
      - name: Check the signature and notify the owner
        uses: actions/github-script@v7
        env:
          # >>> REPLACE with your GitHub username (no @), e.g. 'ranga' <<<
          OWNER_USERNAME: 'YOUR-GITHUB-USERNAME'
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            const field = (label) => {
              const m = body.match(new RegExp(`### ${label}\\s+([\\s\\S]*?)(?=\\n### |$)`));
              return m ? m[1].trim() : '';
            };
            const name = field('Full legal name');
            const user = field('GitHub username').replace(/^@/, '');
            const date = field('Date');
            const accepted = /- \[x\] I have read the CoachBase NDA/i.test(body);

            const problems = [];
            if (!accepted) problems.push('the acceptance box is not ticked');
            if (!name || name === '_No response_') problems.push('the full legal name is missing');
            if (user.toLowerCase() !== issue.user.login.toLowerCase())
              problems.push(`the GitHub username "${user}" does not match the account that opened this issue (${issue.user.login})`);
            if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) problems.push('the date is not in YYYY-MM-DD format');

            const base = { owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number };
            if (problems.length) {
              await github.rest.issues.createComment({ ...base,
                body: `This signature can't be accepted yet because ${problems.join(', and ')}. Please close this issue and submit the form again.` });
              await github.rest.issues.addLabels({ ...base, labels: ['nda-invalid'] });
              return;
            }

            await github.rest.issues.addLabels({ ...base, labels: ['nda-signed'] });
            await github.rest.issues.createComment({ ...base,
              body: [
                `Signed by **${name}** (@${issue.user.login}) on ${date}, for NDA Version 1.`,
                `Recorded at ${new Date().toISOString()} from issue author account ID ${issue.user.id}.`,
                '',
                `@${process.env.OWNER_USERNAME} this person has signed. Invite @${issue.user.login} to the private CoachBase repository, then close this issue.`
              ].join('\n') });
            // Lock so the signature record can't be edited by further comments.
            await github.rest.issues.lock({ ...base, lock_reason: 'resolved' });
